{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">FARM DIRECTORY</span><h1>My farms</h1><p class="muted">Your registered agricultural spaces.</p></div><a class="btn" href="{% url 'farm_create' %}">+ Add farm</a></div><div class="feature-grid">{% for farm in farms %}<a class="feature farm-card" href="{% url 'farm_detail' farm.pk %}"><div class="feature-icon">⌂</div><h3>{{ farm.name }}</h3><p>{{ farm.location }}</p><b>{{ farm.area_acres }} acres · {{ farm.soil_type }}</b></a>{% empty %}<div class="panel"><p class="empty">No farms recorded yet.</p></div>{% endfor %}</div>{% endblock %}
